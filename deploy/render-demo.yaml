# Optional two-service demo Blueprint. Applying it creates services;
# committing this file does not deploy anything.
services:
  - type: web
    name: adel-overtakr-api-demo
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FASTF1_CACHE_DIR
        value: ff1cache
  - type: web
    name: adel-overtakr-web-demo
    runtime: node
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
