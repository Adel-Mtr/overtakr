# Create this Blueprint once, then wire the actual assigned HTTPS URLs.
# example.invalid deliberately prevents use of guessed or unrelated hosts.
projects:
  - name: Overtakr portfolio
    environments:
      - name: demo
        services:
          - type: web
            name: adel-overtakr-api-demo
            runtime: python
            plan: free
            region: frankfurt
            branch: main
            rootDir: backend
            buildCommand: pip install -r requirements.txt
            startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
            healthCheckPath: /api/health
            autoDeployTrigger: "off"
            envVars:
              - key: PYTHON_VERSION
                value: 3.13.3
              - key: CORS_ALLOW_ORIGINS
                value: https://example.invalid
              - key: FRONTEND_URL
                value: https://example.invalid
              - key: FASTF1_CACHE_DIR
                value: ff1cache
          - type: web
            name: adel-overtakr-web-demo
            runtime: node
            plan: free
            region: frankfurt
            branch: main
            rootDir: frontend
            buildCommand: npm ci && npm run build && cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static
            startCommand: HOSTNAME=0.0.0.0 node .next/standalone/server.js
            healthCheckPath: /
            autoDeployTrigger: "off"
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: NEXT_PUBLIC_API_BASE_URL
                value: https://example.invalid
